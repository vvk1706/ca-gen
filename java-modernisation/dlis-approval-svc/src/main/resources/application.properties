# ──────────────────────────────────────────────────────────────────────────────
# DLIS Approval Service — Quarkus application configuration
# ──────────────────────────────────────────────────────────────────────────────

quarkus.application.name=dlis-approval-svc
quarkus.application.version=2.0.0-SNAPSHOT

quarkus.http.port=8080

# ── Database ──────────────────────────────────────────────────────────────────
quarkus.datasource.db-kind=db2
quarkus.datasource.username=${DB2_USER:dlisapp}
quarkus.datasource.password=${DB2_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:db2://${DB2_HOST:db2.dlis.internal}:${DB2_PORT:50000}/${DB2_DBNAME:DLISDB}:currentSchema=DLIS;
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10

# ── REST Client — Application Service ────────────────────────────────────────
quarkus.rest-client.application-svc.url=http://${APPLICATION_SVC_HOST:dlis-application-svc}:${APPLICATION_SVC_PORT:8080}
quarkus.rest-client.application-svc.connect-timeout=5000
quarkus.rest-client.application-svc.read-timeout=10000

# ── Logging ───────────────────────────────────────────────────────────────────
quarkus.log.console.json=${LOG_JSON:false}
quarkus.log.level=INFO
quarkus.log.category."com.dlis".level=DEBUG

# ── OpenAPI ───────────────────────────────────────────────────────────────────
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
mp.openapi.extensions.smallrye.info.title=DLIS Approval Service API
mp.openapi.extensions.smallrye.info.version=2.0.0

# ── Health ────────────────────────────────────────────────────────────────────
quarkus.smallrye-health.root-path=/health

# ── Container image ───────────────────────────────────────────────────────────
quarkus.container-image.group=${IMAGE_GROUP:dlis}
quarkus.container-image.name=dlis-approval-svc
quarkus.container-image.tag=${IMAGE_TAG:latest}
quarkus.jib.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-17-runtime:latest

# ── OpenShift ─────────────────────────────────────────────────────────────────
quarkus.kubernetes.deployment-target=openshift
quarkus.openshift.route.expose=true
quarkus.openshift.replicas=2
quarkus.openshift.resources.requests.memory=256Mi
quarkus.openshift.resources.requests.cpu=100m
quarkus.openshift.resources.limits.memory=512Mi
quarkus.openshift.resources.limits.cpu=500m

# ── Test profile ──────────────────────────────────────────────────────────────
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test_approval;DB_CLOSE_DELAY=-1;MODE=DB2
