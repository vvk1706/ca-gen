# ──────────────────────────────────────────────────────────────────────────────
# DLIS Candidate Service — Quarkus application configuration
# Target: Red Hat OpenShift on IBM Z / LinuxONE (s390x / zLinux)
# ──────────────────────────────────────────────────────────────────────────────

# Service identity
quarkus.application.name=dlis-candidate-svc
quarkus.application.version=2.0.0-SNAPSHOT

# HTTP server
quarkus.http.port=8080
quarkus.http.root-path=/

# ── Database (DB2) ────────────────────────────────────────────────────────────
# These values are overridden at runtime via environment variables or
# OpenShift ConfigMap / Secret (see deploy/ocp/ manifests).
quarkus.datasource.db-kind=db2
quarkus.datasource.username=${DB2_USER:dlisapp}
quarkus.datasource.password=${DB2_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:db2://${DB2_HOST:db2.dlis.internal}:${DB2_PORT:50000}/${DB2_DBNAME:DLISDB}:currentSchema=DLIS;

# Connection pool (Agroal)
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=30

# ── Logging ───────────────────────────────────────────────────────────────────
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.console.json=${LOG_JSON:false}
quarkus.log.level=INFO
quarkus.log.category."com.dlis".level=DEBUG

# ── OpenAPI / Swagger UI ─────────────────────────────────────────────────────
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.info.title=DLIS Candidate Service API
mp.openapi.extensions.smallrye.info.version=2.0.0
mp.openapi.extensions.smallrye.info.description=Driver License Issuance System — Candidate microservice

# ── Health ────────────────────────────────────────────────────────────────────
quarkus.smallrye-health.root-path=/health

# ── Container image (built with Jib) ─────────────────────────────────────────
# Overridden by CI/CD pipeline environment variables
quarkus.container-image.group=${IMAGE_GROUP:dlis}
quarkus.container-image.name=dlis-candidate-svc
quarkus.container-image.tag=${IMAGE_TAG:latest}
# s390x base image — UBI 9 minimal with IBM Semeru JRE 17
quarkus.jib.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-17-runtime:latest

# ── Kubernetes / OpenShift resource generation ───────────────────────────────
quarkus.kubernetes.deployment-target=openshift
quarkus.openshift.route.expose=true
quarkus.openshift.replicas=2
quarkus.openshift.resources.requests.memory=256Mi
quarkus.openshift.resources.requests.cpu=100m
quarkus.openshift.resources.limits.memory=512Mi
quarkus.openshift.resources.limits.cpu=500m

# ── Test profile overrides ────────────────────────────────────────────────────
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test_candidate;DB_CLOSE_DELAY=-1;MODE=DB2
