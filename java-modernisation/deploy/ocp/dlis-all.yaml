metadata:
  name: dlis-application-svc
  namespace: dlis
spec:
  to:
    kind: Service
    name: dlis-application-svc
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
