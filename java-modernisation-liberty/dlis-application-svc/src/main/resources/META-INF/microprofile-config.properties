# MicroProfile Config properties for Application Service
# In OpenShift / Kubernetes: dlis-candidate-svc resolves via cluster DNS
candidate-svc/mp-rest/url=http://${CANDIDATE_SVC_HOST:dlis-candidate-svc}:${CANDIDATE_SVC_PORT:9080}
candidate-svc/mp-rest/connectTimeout=5000
candidate-svc/mp-rest/readTimeout=10000

mp.openapi.scan.classes=com.dlis.application.ApplicationResource
