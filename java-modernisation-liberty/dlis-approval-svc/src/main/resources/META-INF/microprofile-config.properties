# MicroProfile Config properties for Approval Service
# In OpenShift / Kubernetes: dlis-application-svc resolves via cluster DNS
application-svc/mp-rest/url=http://${APPLICATION_SVC_HOST:dlis-application-svc}:${APPLICATION_SVC_PORT:9080}
application-svc/mp-rest/connectTimeout=5000
application-svc/mp-rest/readTimeout=10000

mp.openapi.scan.classes=com.dlis.approval.ApprovalResource
