# ──────────────────────────────────────────────────────────────────────────────
# DLIS Microservices (Open Liberty) — OpenShift / Kubernetes Manifests
# Namespace: dlis-liberty
# Platform:  Red Hat OpenShift 4.14+ on IBM Z / LinuxONE (s390x) / x86-64
#
# Apply with:
#   oc apply -f deploy/ocp/dlis-all.yaml
#
# Secret (DB2_PASSWORD) must be populated before apply
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: dlis-liberty
  labels:
    app.kubernetes.io/managed-by: oc
---
# ──────────────────────────────────────────────────────────────────────────────
# ConfigMap — shared DB2 and service-discovery config (non-sensitive)
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: dlis-config
  namespace: dlis-liberty
data:
  DB2_HOST:              "db2.dlis.internal"
  DB2_PORT:              "50000"
  DB2_DBNAME:            "DLISDB"
  DB2_USER:              "dlisapp"
  LOG_JSON:              "true"
  HTTP_PORT:             "9080"
  HTTPS_PORT:            "9443"
  CANDIDATE_SVC_HOST:    "dlis-candidate-svc"
  CANDIDATE_SVC_PORT:    "9080"
  APPLICATION_SVC_HOST:  "dlis-application-svc"
  APPLICATION_SVC_PORT:  "9080"
---
# ──────────────────────────────────────────────────────────────────────────────
# Secret — DB2 credentials (placeholder — populate before apply)
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: dlis-db2-secret
  namespace: dlis-liberty
type: Opaque
stringData:
  DB2_PASSWORD: "CHANGE_ME"
---
# ══════════════════════════════════════════════════════════════════════════════
# CANDIDATE SERVICE (Open Liberty)
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dlis-candidate-svc
  namespace: dlis-liberty
  labels:
    app: dlis-candidate-svc
    version: "2.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dlis-candidate-svc
  template:
    metadata:
      labels:
        app: dlis-candidate-svc
        version: "2.0.0"
    spec:
      tolerations:
        - key: "arch"
          operator: "Equal"
          value: "s390x"
          effect: "NoSchedule"
      nodeSelector:
        kubernetes.io/arch: s390x
      containers:
        - name: dlis-candidate-svc
          image: IMAGE_REGISTRY/dlis/dlis-candidate-svc-liberty:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9080
              name: http
            - containerPort: 9443
              name: https
          envFrom:
            - configMapRef:
                name: dlis-config
            - secretRef:
                name: dlis-db2-secret
          resources:
            requests:
              memory: "384Mi"
              cpu: "150m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9080
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dlis-candidate-svc
  namespace: dlis-liberty
  labels:
    app: dlis-candidate-svc
spec:
  type: ClusterIP
  ports:
    - port: 9080
      targetPort: 9080
      name: http
  selector:
    app: dlis-candidate-svc
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dlis-candidate-svc
  namespace: dlis-liberty
  labels:
    app: dlis-candidate-svc
spec:
  to:
    kind: Service
    name: dlis-candidate-svc
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
# ══════════════════════════════════════════════════════════════════════════════
